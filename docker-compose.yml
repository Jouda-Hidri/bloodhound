name: bloodhound

services:

  # Kafka-compatible broker. Redpanda rather than Kafka + ZooKeeper/KRaft because it is a single
  # container with the same client API — the Java code here would work unchanged against Kafka.
  redpanda:
    image: redpandadata/redpanda:v24.3.1
    container_name: bloodhound-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --default-log-level=warn
      # Two listeners: `internal` for other containers, `external` for apps run on the host.
      # Getting advertised addresses wrong is the single most common Kafka-in-Docker failure.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      # Auto-creation off. With it on, whichever client mentions a topic first wins — and the
      # default is one partition. Kafka Streams then finds its own repartition topics already
      # created with the wrong partition count and shuts the whole client down:
      #   "Existing internal topic ...-repartition has invalid partitions: expected: 6; actual: 1"
      # Explicit topics also mean a typo in a topic name fails loudly instead of silently
      # publishing into a brand new topic nobody is reading.
      - --set
      - redpanda.auto_create_topics_enabled=false
    ports:
      - "19092:19092"   # Kafka API (host)
      - "18082:18082"   # HTTP proxy (host)
      # Redpanda's own schema registry (container port 18081) is deliberately NOT published.
      # See the schema-registry service below for why we run Confluent's instead.
      - "9644:9644"     # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates topics explicitly instead of relying on auto-creation, which would give every topic
  # one partition and no retention policy.
  redpanda-init:
    image: redpandadata/redpanda:v24.3.1
    container_name: bloodhound-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        rpk topic create security.events.raw \
          --brokers redpanda:9092 \
          --partitions 6 \
          --replicas 1 \
          --topic-config retention.ms=604800000 \
          --topic-config cleanup.policy=delete || true
        rpk topic create security.events.raw.dlq \
          --brokers redpanda:9092 \
          --partitions 3 \
          --replicas 1 \
          --topic-config retention.ms=2592000000 || true
        # Alerts are keyed by entity, so partition count bounds how much the responder could ever
        # parallelise. Kept equal to the event topic for symmetry.
        rpk topic create security.alerts \
          --brokers redpanda:9092 \
          --partitions 6 \
          --replicas 1 \
          --topic-config retention.ms=2592000000 || true
        rpk topic create security.alerts.dlq \
          --brokers redpanda:9092 \
          --partitions 3 \
          --replicas 1 \
          --topic-config retention.ms=2592000000 || true
        # Per-account behavioural baselines, consumed by the detector as a GlobalKTable.
        #
        # cleanup.policy=compact, not delete: this is a *table*, not a stream. Compaction keeps
        # the latest value per key forever, so a detector starting cold rebuilds the full
        # baseline set from the topic. Under a retention policy the older keys would age out and
        # the detector would silently come up knowing nothing about the quieter accounts.
        rpk topic create security.baselines \
          --brokers redpanda:9092 \
          --partitions 1 \
          --replicas 1 \
          --topic-config cleanup.policy=compact \
          --topic-config min.cleanable.dirty.ratio=0.1 || true
        rpk topic list --brokers redpanda:9092
    restart: "no"

  # Confluent's Schema Registry, running against Redpanda's Kafka API.
  #
  # Redpanda ships its own registry and it would be the obvious choice — but its JSON Schema
  # support rejects any schema containing a property literally named `id`, anywhere in the tree:
  #
  #   {"error_code":422,"message":"bundled schema with mismatched dialect '...' for id key"}
  #
  # It appears to treat a *property named* `id` as the legacy draft-04 `id` keyword. ECS mandates
  # both `event.id` and `user.id`, so that is not a field we can rename. Minimal reproduction is
  # in docs/decisions/0003-schema-contracts.md.
  #
  # Confluent's registry handles the same schema correctly, and it speaks the identical REST API,
  # so only the URL changes. Worth knowing that "Kafka-compatible" holds at the protocol level far
  # more reliably than it does across the surrounding ecosystem.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    container_name: bloodhound-schema-registry
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://redpanda:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    ports:
      # 18085, not the conventional 8081: a kubectl port-forward binds 127.0.0.1:18081 on this
      # machine, and a process bound to loopback beats Docker's 0.0.0.0 mapping for localhost
      # connections — requests reach the wrong service with no error to explain it.
      - "${BLOODHOUND_SCHEMA_REGISTRY_PORT:-18085}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Web UI for browsing topics and messages. Very useful when an event is not arriving and you
  # need to know whether the producer or the consumer is at fault.
  console:
    image: redpandadata/console:v2.8.0
    container_name: bloodhound-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://schema-registry:8081
    ports:
      # Host ports are deliberately non-default: 8080 and 5432 are already taken on this machine
      # by another project. Override with BLOODHOUND_CONSOLE_PORT / BLOODHOUND_POSTGRES_PORT.
      - "${BLOODHOUND_CONSOLE_PORT:-8090}:8080"

  postgres:
    image: postgres:16-alpine
    container_name: bloodhound-postgres
    environment:
      POSTGRES_DB: bloodhound
      POSTGRES_USER: bloodhound
      POSTGRES_PASSWORD: bloodhound
    ports:
      - "${BLOODHOUND_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      # Raised from the 100MB default: partitioned tables with several indexes each generate
      # a lot of WAL during bulk ingest, and the default causes constant checkpointing.
      - -c
      - max_wal_size=2GB
      - -c
      - shared_buffers=256MB
      # Logs any statement slower than a second, which is how you find the missing index.
      - -c
      - log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodhound -d bloodhound"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ------------------------------------------------------------------
  # Observability
  # ------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: bloodhound-prometheus
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      # 9090 is taken on this machine, so Prometheus is exposed on 9091.
      - "${BLOODHOUND_PROMETHEUS_PORT:-9091}:9090"
    extra_hosts:
      # Docker Desktop provides this automatically; the entry makes Linux behave the same, so
      # Prometheus can scrape the four services running on the host.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: bloodhound-grafana
    depends_on:
      - prometheus
      - postgres
    environment:
      # Anonymous admin: this is a laptop, and a login screen between you and your own dashboards
      # teaches nothing. Never do this anywhere real.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_FEATURE_TOGGLES_ENABLE: publicDashboards
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${BLOODHOUND_GRAFANA_PORT:-3000}:3000"

  # ------------------------------------------------------------------
  # Search tier — opt in with: docker compose --profile search up -d
  #
  # Behind a profile because OpenSearch wants about 1.5GB of RAM on its own. The platform works
  # without it: Postgres stays the system of record and the consumer degrades to not indexing.
  # ------------------------------------------------------------------

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: bloodhound-opensearch
    profiles: [search]
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # Security plugin off: TLS and an admin password between you and a laptop index is friction
      # with no lesson attached. Week 19 is where auth gets taken seriously.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${BLOODHOUND_OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    container_name: bloodhound-opensearch-dashboards
    profiles: [search]
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "${BLOODHOUND_OSD_PORT:-5601}:5601"

  # ------------------------------------------------------------------
  # Lakehouse — opt in with: docker compose --profile lake up -d
  #
  # The third storage tier, and the one that is cheap per byte. Postgres holds days,
  # OpenSearch holds what you search interactively, object storage holds years.
  # ------------------------------------------------------------------

  minio:
    # Docker Hub's minio/minio now requires authentication; quay.io is MinIO's own
    # public registry and serves the identical image.
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: bloodhound-minio
    profiles: [lake]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bloodhound
      MINIO_ROOT_PASSWORD: bloodhound123
    ports:
      - "${BLOODHOUND_MINIO_PORT:-9000}:9000"
      - "${BLOODHOUND_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-11-05T11-29-45Z
    container_name: bloodhound-minio-init
    profiles: [lake]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set lake http://minio:9000 bloodhound bloodhound123
        mc mb --ignore-existing lake/bloodhound-events
        mc mb --ignore-existing lake/bloodhound-warehouse
        # Object storage is where retention gets expensive to get wrong: there is no
        # partition to drop, only millions of objects to enumerate. A lifecycle rule makes
        # expiry the storage layer's job rather than a job that has to keep up.
        mc ilm rule add --expiry-days 365 lake/bloodhound-events 2>/dev/null || true
        mc ls lake
    restart: "no"

  # ------------------------------------------------------------------
  # Cloud emulation — opt in with: docker compose --profile cloud up -d
  #
  # LocalStack emulates the AWS APIs well enough to prove a Terraform configuration is coherent.
  # It does not emulate IAM evaluation, quotas, cost, or the ways real AWS says no — so
  # `terraform apply` against it validates the configuration, not the deployment.
  # ------------------------------------------------------------------

  localstack:
    image: localstack/localstack:3.8
    container_name: bloodhound-localstack
    profiles: [cloud]
    environment:
      SERVICES: s3,iam,sts,kms,sns,sqs,logs,cloudtrail,events
      DEBUG: "0"
      AWS_DEFAULT_REGION: eu-central-1
    ports:
      - "${BLOODHOUND_LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ------------------------------------------------------------------
  # Identity — opt in with: docker compose --profile auth up -d
  #
  # Replaces the API keys from Week 18 with real OIDC. The keys were config-file strings that
  # never expired, could not be rotated without a restart, and made the audit trail say
  # "someone holding the responder key" rather than naming a person.
  # ------------------------------------------------------------------

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: bloodhound-keycloak
    profiles: [auth]
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: bloodhound
      # Keycloak's own store. Its own database, like Airflow's: different lifecycle, and realm
      # migrations should never be able to touch the security data.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: bloodhound
      KC_DB_PASSWORD: bloodhound
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # The issuer string is baked into every token and must match what the resource server
      # expects, byte for byte. Tokens minted as `localhost:8280` are rejected by a validator
      # configured for `keycloak:8080` — the single most common OIDC-in-Docker failure.
      KC_HOSTNAME: http://localhost:8280
    volumes:
      - ./ops/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${BLOODHOUND_KEYCLOAK_PORT:-8280}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/bloodhound HTTP/1.1\\nHost: localhost\\nConnection: close\\n\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 40

  keycloak-db-init:
    image: postgres:16-alpine
    container_name: bloodhound-keycloak-db-init
    profiles: [auth]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: bloodhound
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -h postgres -U bloodhound -d bloodhound -tc \
          "select 1 from pg_database where datname='keycloak'" | grep -q 1 \
          || psql -h postgres -U bloodhound -d bloodhound -c "create database keycloak"
        echo "keycloak database ready"
    restart: "no"

  # ------------------------------------------------------------------
  # Orchestration — opt in with: docker compose --profile orchestrator up -d
  #
  # Scheduler and webserver as separate services, which is the shape a real deployment has.
  # `airflow standalone` would be one container, and would teach the wrong thing about how
  # Airflow is actually operated.
  # ------------------------------------------------------------------

  airflow-db-init:
    image: postgres:16-alpine
    container_name: bloodhound-airflow-db-init
    profiles: [orchestrator]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: bloodhound
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Airflow's metadata belongs in its own database, not in a schema beside the security
        # data. Different lifecycle, different backup policy, and Airflow migrations should
        # never be able to touch raw_events.
        psql -h postgres -U bloodhound -d bloodhound -tc \
          "select 1 from pg_database where datname='airflow'" | grep -q 1 \
          || psql -h postgres -U bloodhound -d bloodhound -c "create database airflow"
        echo "airflow metadata database ready"
    restart: "no"

  airflow-init:
    build:
      context: .
      dockerfile: ops/airflow/Dockerfile
    image: bloodhound/airflow:2.10.5
    container_name: bloodhound-airflow-init
    profiles: [orchestrator]
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
    environment: &airflow-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://bloodhound:bloodhound@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      # Fernet key is fixed so connections survive a restart. A real deployment generates one
      # and keeps it in a secret store; hard-coding it is a lab-only shortcut.
      AIRFLOW__CORE__FERNET_KEY: "U3VwZXJTZWNyZXRGZXJuZXRLZXlGb3JCbG9vZGhvdW5kTGFiPQ=="
      # The analytics scripts talk to Postgres and MinIO by container name, and to the
      # Java services on the host through host.docker.internal.
      BLOODHOUND_DSN: postgresql://bloodhound:bloodhound@postgres:5432/bloodhound
      BLOODHOUND_S3_ENDPOINT: http://minio:9000
      BLOODHOUND_CONSUMER_URL: http://host.docker.internal:8102
      BLOODHOUND_RETAIN_DAYS: "30"
      PYTHONPATH: /opt/bloodhound/analytics
    volumes: &airflow-volumes
      - ./ops/airflow/dags:/opt/airflow/dags:ro
      - ./analytics:/opt/bloodhound/analytics:ro
      - airflow-logs:/opt/airflow/logs
    extra_hosts: &airflow-hosts
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate
        airflow users create --username admin --password bloodhound \
          --firstname Lab --lastname Operator --role Admin --email admin@bloodhound.lab || true
        echo "airflow initialised"
    restart: "no"

  airflow-scheduler:
    image: bloodhound/airflow:2.10.5
    container_name: bloodhound-airflow-scheduler
    profiles: [orchestrator]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    extra_hosts: *airflow-hosts
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 20s
      timeout: 10s
      retries: 10

  airflow-webserver:
    image: bloodhound/airflow:2.10.5
    container_name: bloodhound-airflow-webserver
    profiles: [orchestrator]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    extra_hosts: *airflow-hosts
    command: webserver
    ports:
      - "${BLOODHOUND_AIRFLOW_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15

volumes:
  redpanda-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  opensearch-data:
  minio-data:
  airflow-logs:
  localstack-data:
