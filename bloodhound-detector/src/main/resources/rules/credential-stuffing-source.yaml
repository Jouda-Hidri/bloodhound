id: credential-stuffing-source
name: Credential stuffing from a single source
description: >
  One source address attempting logins against many distinct accounts in a short window.
  Stolen credential lists being replayed.

  The entity here is the source address, not a user — this alert is about hostile infrastructure.
  That distinction matters at response time: blocking the source is right, and locking the
  accounts it touched would mean locking out hundreds of innocent users on the attacker's behalf.
severity: high
technique: T1110.004
enabled: true

match:
  event.action: user-login

group_by: source.ip
entity_type: source_ip

window: PT10M
grace: PT2M

distinct: user.id
threshold: 25

context_fields:
  - source.geo.country_iso_code
  - user_agent.original
  - event.outcome
