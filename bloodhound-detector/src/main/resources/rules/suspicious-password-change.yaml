id: suspicious-password-change
name: Password changes from unfamiliar infrastructure
description: >
  Credential changes are the step an attacker takes to keep access after a takeover. Volume alone
  is weak evidence, so this rule is narrow: password changes coming from the scripted user agents
  the simulated adversary uses, rather than a browser.

  In a real deployment matching on user agent is trivially evaded — an attacker who sets a browser
  user agent defeats it entirely. It is here because it demonstrates match_any, and because a weak
  signal feeding a risk score is still worth something even when it would not justify an alert on
  its own.
severity: medium
technique: T1098
enabled: true

match:
  event.action: password-change

match_any:
  user_agent.original:
    - python-requests/2.32.3
    - Go-http-client/2.0
    - Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) HeadlessChrome/126.0.0.0 Safari/537.36

group_by: user.id
entity_type: user

window: PT30M
grace: PT5M
threshold: 1

context_fields:
  - source.ip
  - source.geo.country_iso_code
  - user_agent.original
