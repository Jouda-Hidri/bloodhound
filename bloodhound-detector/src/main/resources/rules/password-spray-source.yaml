id: password-spray-source
name: Password spraying from a single source
description: >
  One source, failed logins against a very large number of distinct accounts, over a long window.
  A spray is deliberately slow — a handful of attempts per account — precisely so that no
  per-account threshold is ever crossed.

  This overlaps with credential-stuffing-source by design: a fast, high-volume attack will trip
  both. The rule DSL cannot express "many accounts but NOT quickly", because it has no notion of
  rate, only of counts within a window. Collapsing the resulting duplicate alerts is the
  responder's job, not the rule's. Writing a rate condition into the DSL was considered and
  rejected — see docs/decisions/0004-detection-as-data.md.
severity: medium
technique: T1110.003
enabled: true

match:
  event.action: user-login
  event.outcome: failure

group_by: source.ip
entity_type: source_ip

window: PT60M
grace: PT5M

distinct: user.id
threshold: 40

context_fields:
  - source.geo.country_iso_code
  - user_agent.original
